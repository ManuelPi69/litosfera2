<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Litosfera Viva</title>
<meta name="description" content="Modelo 3D/VR de uma zona de subducção com estratovulcão ativo: trilha de aprendizagem em Geografia Física e Geologia.">
<style>
:root{color-scheme:dark;
  --bg:#0a1020; --panel:rgba(14,20,38,.92); --line:#27314f; --ink:#e8edf8; --mut:#9aa7c7;
  --lava:#ff6a2b; --lava2:#ffb347; --ok:#3ddc97; --bad:#ff5a5f; --blue:#4aa3ff;
  --r:12px; --gut:16px; --pw:400px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

#top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px var(--gut);pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:999px;backdrop-filter:blur(8px)}
.brand b{font-size:16px;letter-spacing:.2px}
.brand small{color:var(--mut);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--lava);box-shadow:0 0 10px var(--lava);align-self:center}
.actions{display:flex;gap:8px}
button{font:inherit;color:var(--ink);cursor:pointer}
.actions button{background:var(--panel);border:1px solid var(--line);padding:9px 14px;border-radius:999px;backdrop-filter:blur(8px)}
.actions .vr{background:linear-gradient(135deg,#ff6a2b,#d63a1f);border-color:transparent;font-weight:600}
.actions .vr:disabled{background:var(--panel);border-color:var(--line);color:var(--mut);cursor:default}
.actions button:hover:not(:disabled){filter:brightness(1.15)}

#panel{position:fixed;z-index:4;top:64px;right:var(--gut);bottom:var(--gut);width:var(--pw);max-width:calc(100vw - 2*var(--gut));display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);overflow:hidden;transition:transform .25s ease,opacity .25s}
#panel.closed{transform:translateX(calc(100% + 24px));opacity:0;pointer-events:none}
#tabs{display:flex;gap:4px;padding:8px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:transparent;border:1px solid transparent;border-radius:10px;padding:6px 10px;text-align:left;color:var(--mut);min-width:84px}
.tab span{display:block;font-weight:600;font-size:13px}
.tab small{display:block;font-size:11px;opacity:.8;white-space:nowrap}
.tab.on{background:rgba(255,106,43,.14);border-color:rgba(255,106,43,.6);color:var(--ink)}
#body{flex:1;overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
#body h3{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--lava2)}
#body h3:first-child{margin-top:0}
#body p{margin:6px 0 10px;color:#cfd7ec}
#body p.ok{color:var(--ok)} #body p.bad{color:var(--bad)}
.row{margin:10px 0}
.row>label{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut);margin-bottom:4px}
.row>label b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;height:28px;accent-color:var(--lava);background:transparent}
.tog{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer;color:#cfd7ec}
.tog input{width:20px;height:20px;accent-color:var(--lava)}
.btn{display:block;width:100%;margin:8px 0;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:#1a2340;font-weight:600}
.btn:hover{background:#222d52}
.btn.hot{background:linear-gradient(135deg,#ff6a2b,#d63a1f);border-color:transparent}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;padding:8px 6px;border-radius:9px;border:1px solid var(--line);background:#141c36;font-size:13px}
.seg button.on{background:rgba(255,106,43,.2);border-color:var(--lava)}
.bar{height:10px;background:#141c36;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lava2);transition:width .2s}
.tasks{list-style:none;margin:10px 0;padding:10px 12px;background:#101731;border:1px solid var(--line);border-radius:10px}
.tasks li{padding:3px 0;color:var(--mut);font-size:14px} .tasks li.done{color:var(--ok)}
.ro{margin:8px 0;padding:10px 12px;background:#101731;border:1px solid var(--line);border-radius:10px;font-size:13px;white-space:pre-line;color:#cfd7ec}
.choice{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#141c36;line-height:1.35}
.choice:hover{background:#1c2748}
.choice.ok{border-color:var(--ok);background:rgba(61,220,151,.14)}
.choice.bad{border-color:var(--bad);background:rgba(255,90,95,.14)}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:6;max-width:min(560px,calc(100vw - 32px));background:rgba(255,179,71,.96);color:#1b1206;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#vrMsg{margin:0;padding:0 16px 10px;font-size:12px;color:var(--mut);flex:none}
#vrMsg:empty{display:none}

#boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:var(--bg);transition:opacity .5s}
#boot.off{opacity:0;pointer-events:none}
.spin{width:42px;height:42px;margin:0 auto 12px;border-radius:50%;border:4px solid #27314f;border-top-color:var(--lava);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:820px){
  .brand small{display:none}
  .actions .ghost#btnView{display:none}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-width:none;height:46vh;max-height:46vh}
  #panel.closed{transform:translateY(calc(100% + 16px))}
  #toast{bottom:calc(46vh + 20px)}
}
@media (max-width:820px) and (orientation:landscape){
  #panel{left:auto;width:min(380px,48vw);top:56px;height:auto;max-height:none}
  #toast{bottom:16px}
}

</style>
</head>
<body>
<canvas id="c"></canvas>

<header id="top">
  <div class="brand"><span class="dot"></span><b>Litosfera Viva</b><small>Tectônica &amp; Erupção</small></div>
  <div class="actions">
    <button id="btnView" class="ghost" title="Recentrar a câmera">⌖ Recentrar</button>
    <button id="vrBtn" class="vr" disabled>Verificando VR…</button>
    <button id="toggle" class="ghost" title="Mostrar/ocultar painel">☰</button>
  </div>
</header>

<aside id="panel">
  <nav id="tabs" aria-label="Trilha de aprendizagem"></nav>
  <div id="body"></div>
  <p id="vrMsg" role="status"></p>
</aside>

<div id="toast" role="status"></div>
<div id="boot"><div><div class="spin"></div><p id="bootMsg">Carregando o planeta…</p></div></div>

<script>
/* three.js r128 por CDN (com planos B); depois executa os módulos embutidos na ordem */
(function () {
  var urls = ["https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
              "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js",
              "https://unpkg.com/three@0.128.0/build/three.min.js"];
  var msg = document.getElementById("bootMsg");
  function fail(t) { msg.textContent = t; }
  function load(src, ok, err) { var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = err; document.head.appendChild(s); }
  function runModules() {
    try {
      document.querySelectorAll('script[type="text/x-app"]').forEach(function (el) {
        var s = document.createElement("script"); s.textContent = el.textContent; document.head.appendChild(s);
      });
    } catch (e) { return fail("Erro ao iniciar o app: " + e.message); }
    var b = document.getElementById("boot"); b.classList.add("off");
    setTimeout(function () { b.style.display = "none"; }, 600);
  }
  function tryThree(i) {
    if (window.THREE) return runModules();
    if (i >= urls.length) return fail("Não foi possível carregar o Three.js. Verifique a conexão com a internet e recarregue a página.");
    load(urls[i], function () { window.THREE ? runModules() : tryThree(i + 1); }, function () { tryThree(i + 1); });
  }
  tryThree(0);
})();
</script>
<script type="text/x-app" data-name="data">
/* Litosfera Viva — estado global, conteúdo pedagógico e cálculos geofísicos simplificados */
window.APP = {
  P: { // parâmetros controlados pelo estudante
    temp: 1000, press: 1.5, silica: 63, water: 5,
    conv: 1, mag: 6.5, depth: 1, rain: false, fric: 0.6,
    auto: true, xray: true, faults: true, convOn: true, labels: true, water3d: true, soil: false, seis: true
  },
  S: { step: 0, view: 'macro', overp: 0, strain: 0, vr: false, ans: {}, micro: false, dive: false },
  tasks: {},
  clamp: (v, a, b) => Math.max(a, Math.min(b, v)),
  mark(id) { if (!this.tasks[id]) { this.tasks[id] = true; this.dirty = true; try { localStorage.setItem('litos_tasks', JSON.stringify(this.tasks)); } catch (e) {} } },
  dirty: true,

  // Viscosidade (log10 Pa·s) e índice de explosividade — modelo didático, não preditivo
  derive() {
    const p = this.P, c = this.clamp;
    const le = c(2 + 0.22 * (p.silica - 48) + (1200 - p.temp) * 0.0055 * (1 + (p.silica - 48) / 20) - 0.35 * p.water, 1, 12);
    const s = c((le - 2) / 7, 0, 1);
    const E = c((le - 2) / 8 * 0.5 + p.water / 8 * 0.4 + (p.press - 0.1) / 3 * 0.15, 0, 1);
    return {
      le, s, E, eta: Math.pow(10, le),
      vei: c(Math.round(1 + E * 6), 1, 7),
      style: E < 0.3 ? 'efusiva' : (E < 0.5 ? 'mista (vulcaniana)' : 'explosiva (pliniana)'),
      name: p.silica < 52 ? 'Máfico (basalto)' : (p.silica < 63 ? 'Intermediário (andesito)' : 'Félsico (dacito/riolito)'),
      cone: s < 0.25 ? 'vulcão em escudo (suave)' : (s < 0.6 ? 'estratovulcão' : 'estratovulcão íngreme / domo')
    };
  },

  steps: [
    { id: 0, title: 'Início', sub: 'Visão geral',
      text: 'Este é um bloco-diagrama vivo de uma zona de subducção: a placa oceânica mergulha sob a placa continental, a água liberada pela placa funde o manto e alimenta um estratovulcão. Gire, aproxime e explore. Siga a trilha nas etapas 1 → 2 → 3 → Quiz.' },
    { id: 1, title: 'Etapa 1', sub: 'Imersão no subsolo',
      text: 'Observe as correntes de convecção do manto (partículas quentes sobem, frias descem) e a fricção entre as placas. Mergulhe no manto, use o microscópio no contato entre as placas e provoque terremotos.' },
    { id: 2, title: 'Etapa 2', sub: 'Laboratório vulcânico',
      text: 'Manipule a composição do magma (sílica), temperatura, pressão e gases. Veja como a viscosidade muda a forma do cone e o tipo de erupção: efusiva (lava fluida) ou explosiva (coluna de cinzas e correntes piroclásticas).' },
    { id: 3, title: 'Etapa 3', sub: 'Geoprocessamento de risco',
      text: 'Mapa do entorno do vulcão. Rode a simulação de correntes piroclásticas e lahares, identifique as áreas de perigo e trace rotas de evacuação seguras da vila até um abrigo.' },
    { id: 4, title: 'Quiz', sub: 'Avaliação formativa',
      text: 'Responda às duas questões e leia o gabarito comentado.' }
  ],

  tasksByStep: {
    1: [['dive', 'Mergulhar no manto'], ['micro', 'Usar o microscópio na falha'], ['quake', 'Ativar um evento sísmico'], ['conv', 'Alterar a temperatura e observar a convecção']],
    2: [['mafic', 'Erupção efusiva com magma máfico'], ['felsic', 'Erupção explosiva com magma félsico'], ['rain', 'Ativar chuva intensa (lahar)']],
    3: [['sim', 'Rodar a simulação de perigo'], ['route', 'Traçar uma rota até um abrigo'], ['safe', 'Evacuar com sucesso']]
  },

  quiz: [
    { q: 'Por que vulcões formados em zonas de subducção tendem a apresentar erupções predominantemente explosivas?',
      o: ['O magma é extremamente fluido, permitindo a saída rápida dos gases.',
          'A fusão parcial da crosta subductada gera magma rico em sílica e gases pressurizados, aumentando a viscosidade e a pressão.',
          'A presença de água do oceano resfria totalmente o manto, impedindo o acúmulo de energia.',
          'As placas se afastam, abrindo fissuras por onde o magma escorre suavemente.'],
      c: 1,
      fb: 'A crosta continental absorvida enriquece o magma em sílica, tornando-o viscoso e retendo gases sob alta pressão até que a explosão ocorra.' },
    { q: 'O que justifica a alta densidade demográfica em encostas de vulcões ativos, a despeito dos riscos geotécnicos?',
      o: ['A ausência de leis de zoneamento ambiental em áreas tectônicas.',
          'A fertilidade dos solos vulcânicos (andossolos), ricos em minerais essenciais para a agricultura.',
          'O clima mais frio do topo dos vulcões atrai a especulação imobiliária.',
          'A facilidade de extração de gás natural diretamente da cratera.'],
      c: 1,
      fb: 'O intemperismo das cinzas vulcânicas produz solos altamente férteis, atraindo populações agrícolas historicamente.' }
  ]
};
try { const t = JSON.parse(localStorage.getItem('litos_tasks') || '{}'); APP.tasks = t; } catch (e) {}

</script>
<script type="text/x-app" data-name="world">
/* Bloco-diagrama: placas, água, falhas, rótulos. Coordenadas: x leste, y cima, z para o observador. */
(function () {
  const T = THREE, A = APP;

  // Topo da placa oceânica (linha de subducção) em função de x
  A.slabY = x => x < -4.5 ? -0.9 : (x < -3.2 ? -0.9 - (x + 4.5) / 1.3 * 0.4 : -1.3 - 0.53 * (x + 3.2));
  A.SLAB_ANGLE = Math.atan(0.53);

  function shape(pts) {
    const s = new T.Shape();
    pts.forEach((p, i) => i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1]));
    return s;
  }
  function layer(pts, color, idx, extra) {
    const g = new T.ExtrudeGeometry(shape(pts), { depth: 8 + idx * 0.02, bevelEnabled: false });
    g.translate(0, 0, -4);
    const m = new T.MeshLambertMaterial(Object.assign({ color }, extra || {}));
    return new T.Mesh(g, m);
  }
  function tube(pts, r, color) {
    const c = new T.CatmullRomCurve3(pts.map(p => new T.Vector3(p[0], p[1], p[2] || 4.14)));
    const m = new T.MeshBasicMaterial({ color });
    return new T.Mesh(new T.TubeGeometry(c, 40, r, 6, false), m);
  }
  A.makeLabel = function (text, x, y, z, sc) {
    const cv = document.createElement('canvas'); cv.width = 512; cv.height = 96;
    const g = cv.getContext('2d');
    g.font = 'bold 40px system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    const w = Math.min(500, g.measureText(text).width + 36);
    g.fillStyle = 'rgba(10,14,24,.78)'; g.beginPath(); g.roundRect ? g.roundRect(256 - w / 2, 8, w, 80, 24) : g.rect(256 - w / 2, 8, w, 80); g.fill();
    g.fillStyle = '#fff'; g.fillText(text, 256, 49, 480);
    const sp = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(cv), depthTest: false, transparent: true }));
    sp.scale.set(5.2 * (sc || 1), 5.2 * (sc || 1) * 96 / 512, 1); sp.position.set(x, y, z); sp.renderOrder = 20;
    return sp;
  };

  A.initWorld = function () {
    const W = A.world = new T.Group();
    const L = A.layers = {};

    // Manto (translúcido para enxergar a convecção)
    L.mantle = layer([[-10, -11], [10, -11], [10, -1], [-10, -1]], 0xd9531e, 0, { transparent: true, opacity: 0.5, depthWrite: false });
    const slabTop = [[-10, -0.9], [-4.5, -0.9], [-3.2, -1.3], [10, A.slabY(10)]];
    const off = (pts, d) => pts.map(p => [p[0], p[1] - d]);
    const slabPoly = slabTop.concat(off(slabTop, 1.1).reverse());
    const crustPoly = slabTop.concat(off(slabTop, 0.3).reverse());

    L.slab = new T.Group();
    L.slab.add(layer(slabPoly, 0x3d4f73, 1), layer(crustPoly, 0x1c2430, 2));
    const cont = [[10, 0.4], [-1, 0.4], [-2.2, -0.3], [-3.2, -1.3], [10, A.slabY(10)]];
    L.cont = layer(cont, 0x6e5b49, 3);
    L.ccrust = layer([[10, 0.4], [-1, 0.4], [-2.2, -0.3], [-2.9, -1.0], [10, -1.0]], 0xb09672, 4);
    L.water = layer([[-10, 0], [-1.6, 0], [-2.2, -0.3], [-3.2, -1.3], [-4.5, -0.9], [-10, -0.9]], 0x2a86e0, 5, { transparent: true, opacity: 0.42, depthWrite: false });
    L.waterTop = new T.Mesh(new T.BoxGeometry(8.4, 0.02, 8), new T.MeshLambertMaterial({ color: 0x57b0ff, transparent: true, opacity: 0.5 }));
    L.waterTop.position.set(-5.8, 0.01, 0);
    L.ground = new T.Mesh(new T.BoxGeometry(11, 0.06, 8), new T.MeshLambertMaterial({ color: 0x5f8f4a }));
    L.ground.position.set(4.5, 0.43, 0);
    // Andossolos (solo vulcânico fértil) — anel ao redor do vulcão
    L.soil = new T.Mesh(new T.RingGeometry(1.2, 3.9, 48), new T.MeshLambertMaterial({ color: 0x3a2a1c, side: T.DoubleSide, transparent: true, opacity: 0.9 }));
    L.soil.rotation.x = -Math.PI / 2; L.soil.position.set(3, 0.5, 0); L.soil.visible = false;

    W.add(L.mantle, L.slab, L.cont, L.ccrust, L.water, L.waterTop, L.ground, L.soil);

    // Falhas geológicas (tubos brilhantes sobre o corte frontal)
    const F = A.faultGroup = new T.Group();
    A.faultMat = [];
    const mega = [], x0 = -3.2;
    for (let i = 0; i <= 10; i++) { const x = x0 + i * 1.3; mega.push([x, A.slabY(x) + 0.02]); }
    const fl = [tube(mega, 0.07, 0xff3b30), tube([[-2.6, -1.7], [-1.6, -0.8], [-0.7, 0.1], [-0.3, 0.4]], 0.045, 0xffb020),
      tube([[0.8, 0.4], [1.1, -0.3], [1.5, -1.0]], 0.04, 0xffb020), tube([[6.0, 0.4], [6.8, -0.5], [7.8, -1.0]], 0.04, 0xffb020),
      tube([[8.2, 0.4], [8.5, -0.4], [9.2, -1.0]], 0.04, 0xffb020)];
    fl.forEach(m => F.add(m)); A.faultMeshes = fl;
    W.add(F);

    // Rótulos
    A.labelGroup = new T.Group();
    [['Placa oceânica', -7, 1.1, 4.3], ['Placa continental', 7.4, 1.5, 4.3], ['Fossa oceânica', -3.4, -2.3, 4.3, 0.85],
      ['Manto astenosférico', -5.5, -7.5, 4.3], ['Cunha do manto (fusão parcial)', 4.2, -4.3, 4.3, 0.95],
      ['Litosfera subductada (slab)', 6.2, -7.2, 4.3, 0.95], ['Megafalha (contato entre placas)', -0.2, -3.0, 4.3, 0.9],
      ['Câmara magmática', 3, -1.9, 4.3, 0.9]].forEach(a => A.labelGroup.add(A.makeLabel(a[0], a[1], a[2], a[3], a[4])));
    W.add(A.labelGroup);
  };

  A.worldUpdate = function (dt, t) {
    const P = A.P, L = A.layers;
    A.faultGroup.visible = P.faults; A.labelGroup.visible = P.labels;
    L.water.visible = L.waterTop.visible = P.water3d; L.soil.visible = P.soil;
    // cor do manto muda com a temperatura
    const k = A.clamp((P.temp - 800) / 600, 0, 1);
    L.mantle.material.color.setRGB(0.45 + 0.55 * k, 0.17 + 0.17 * k, 0.1);
    // ondulação da água e rebote da placa (terremoto)
    const Q = A.Q || { slip: 0, tsu: 0 };
    L.waterTop.position.y = 0.01 + Math.sin(t * 1.5) * 0.015 + Q.tsu * 0.25 * Math.sin(t * 6);
    L.water.scale.y = 1 + Q.tsu * 0.1 * Math.sin(t * 6);
    const d = Q.slip * 0.35;
    L.slab.position.set(Math.cos(A.SLAB_ANGLE) * d, -Math.sin(A.SLAB_ANGLE) * d, 0);
    const pulse = 1 + (Q.amp || 0) * 2;
    A.faultMeshes.forEach(m => m.scale.set(1, 1, 1).multiplyScalar(1)); // mantém geometria
    A.faultMeshes[0].material.color.setRGB(1, 0.23 + Math.min(0.7, (A.S.strain || 0) * 0.5), 0.19);
    A.faultMeshes.forEach(m => m.material.opacity = 1);
  };
})();

</script>
<script type="text/x-app" data-name="volcano">
/* Estratovulcão: cone (forma depende da viscosidade), câmara magmática, erupção (efusiva/explosiva), PDC e lahar */
(function () {
  const T = THREE, A = APP;
  const VX = 3, GY = 0.46; // posição do vulcão e topo do solo
  let cone, chamber, dike, glow, light, lastKey = '';

    vr.s = k.s; vr.c.set(...k.c); vr.a.set(...k.a); vr.yaw = v === 'map' ? 0 : vr.yaw; vr.sT = k.s;
  };
  A.resetCam = () => A.applyView();
  A.vrToggleScale = () => { S.vrScale = !S.vrScale; A.applyView(); };

  function init() {
    canvas = document.getElementById('c');
    renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.xr.enabled = true;
    scene = new T.Scene(); scene.background = new T.Color(0x0a1020); scene.fog = new T.Fog(0x0a1020, 60, 140);
    camera = new T.PerspectiveCamera(50, innerWidth / innerHeight, 0.03, 300); scene.add(camera);
    scene.add(new T.HemisphereLight(0xcfe2ff, 0x40303a, 0.95)); const dl = new T.DirectionalLight(0xffffff, 0.8); dl.position.set(10, 20, 16); scene.add(dl);
    stage = new T.Group(); scene.add(stage);
    A.initWorld(); A.initVolcano(); A.initFlow(); A.initMap(); A.initUI(); A.initVRPanel();
    stage.add(A.world, A.micro, A.mapG);
    const floor = new T.GridHelper(12, 24, 0x3a4a70, 0x1b2540); floor.visible = false; scene.add(floor); vr.floor = floor;
    scene.add(A.vrp.mesh); ray = new T.Raycaster();

    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    renderer.setAnimationLoop(frame);
  }

  /* ---------- órbita com mouse / toque ---------- */
  function bindPointer() {
    const ps = new Map(); let down = null, pinch = 0;
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ps.set(e.pointerId, { x: e.clientX, y: e.clientY }); down = { x: e.clientX, y: e.clientY, t: performance.now(), n: ps.size }; if (ps.size === 2) { const [a, b] = [...ps.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); } });
    canvas.addEventListener('pointermove', e => {
      const p = ps.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
      if (ps.size === 1 && !(e.buttons & 2) && !e.shiftKey) { des.az -= dx * 0.006; des.el = A.clamp(des.el + dy * 0.006, -1.4, 1.5); }
      else if (ps.size === 1) pan(dx, dy);
      else if (ps.size === 2) { const [a, b] = [...ps.values()], d = Math.hypot(a.x - b.x, a.y - b.y); des.dist = A.clamp(des.dist * pinch / Math.max(d, 1), 1.5, 70); pinch = d; pan(dx / 2, dy / 2); }
    });
    const up = e => {
      const m = ps.has(e.pointerId); ps.delete(e.pointerId);

    canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('wheel', e => { e.preventDefault(); des.dist = A.clamp(des.dist * (1 + Math.sign(e.deltaY) * 0.09), 1.5, 70); }, { passive: false });
  }
  function pan(dx, dy) {

    des.tx += (-r.x * dx + u.x * dy) * k; des.ty += (-r.y * dx + u.y * dy) * k; des.tz += (-r.z * dx + u.z * dy) * k;
  }
  function mapPick(x, y) {
    ray.setFromCamera({ x: x / innerWidth * 2 - 1, y: -(y / innerHeight) * 2 + 1 }, camera);
    const h = ray.intersectObject(A.mapMesh)[0]; if (h) { const p = A.mapG.worldToLocal(h.point.clone()); A.map.click(p.x, p.z); }
  }

  /* ---------- WebXR (Pico Neo 3: navegador Pico, HTTPS) ---------- */
  const lerpV = (a, b, k) => a + (b - a) * k;
  function initXR() {
    const btn = document.getElementById('vrBtn'), msg = document.getElementById('vrMsg');
    if (!navigator.xr) { btn.disabled = true; btn.textContent = 'VR indisponível'; msg.textContent = 'WebXR não encontrado: abra por HTTPS no Navegador Pico (ou Chrome/Edge com WebXR).'; return; }
    navigator.xr.isSessionSupported('immersive-vr').then(ok => {
      btn.textContent = ok ? '🥽 Entrar em VR' : 'VR indisponível neste dispositivo'; btn.disabled = !ok;
      if (!ok) msg.textContent = 'Este navegador não oferece sessões immersive-vr. No Pico Neo 3 use o Navegador Pico via HTTPS.';
    }).catch(() => { btn.disabled = true; });
    btn.onclick = async () => {
      try {
        if (renderer.xr.isPresenting) { A.exitVR(); return; }
        const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] });
        renderer.xr.setReferenceSpaceType('local-floor'); await renderer.xr.setSession(s); onStart(s);
      } catch (e) { msg.textContent = 'Falha ao iniciar VR: ' + (e.message || e); }
    };
    for (let i = 0; i < 2; i++) {
      const c = renderer.xr.getController(i); c.userData = { i, pressed: false };
      const l = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(), new T.Vector3(0, 0, -3)]), new T.LineBasicMaterial({ color: 0xffd37a })); l.name = 'ray'; c.add(l);
      const dot = new T.Mesh(new T.SphereGeometry(0.012), new T.MeshBasicMaterial({ color: 0xffffff })); dot.position.z = -0.05; c.add(dot);
      c.addEventListener('connected', e => { c.userData.src = e.data; });
      c.addEventListener('selectstart', () => { c.userData.pressed = true; onSelect(c); });
      c.addEventListener('selectend', () => { c.userData.pressed = false; A.vrRelease(); });
      scene.add(c); vr.ctrls.push(c);
    }
  }
  function onStart(session) {
    S.vr = true; vr.floor.visible = true; A.vrp.mesh.visible = true; A.applyView(); A.vrRecenter(); A.vrp.dirty = true;
    session.addEventListener('end', () => { S.vr = false; vr.floor.visible = false; A.vrp.mesh.visible = false; stage.position.set(0, 0, 0); stage.scale.setScalar(1); stage.rotation.set(0, 0, 0); document.getElementById('vrBtn').textContent = '🥽 Entrar em VR'; });
    document.getElementById('vrBtn').textContent = '⏏ Sair do VR';
  }
  A.exitVR = () => { const s = renderer.xr.getSession(); s && s.end(); };
  A.vrRecenter = function () {
    const xc = renderer.xr.getCamera(camera), p = new T.Vector3(), d = new T.Vector3(0, 0, -1);
    p.setFromMatrixPosition(xc.matrixWorld); d.applyQuaternion(xc.quaternion || camera.quaternion); d.y = 0; if (d.lengthSq() < 1e-4) d.set(0, 0, -1); d.normalize();
    const yaw = Math.atan2(-d.x, -d.z), m = A.vrp.mesh;
    m.position.set(p.x + Math.sin(-yaw - 0.55) * 0.0 + (-Math.sin(yaw + 0.55)) * 0.95, Math.max(1.1, p.y - 0.05), p.z + (-Math.cos(yaw + 0.55)) * 0.95); m.rotation.set(0, yaw + 0.55, 0);
  };
  A.haptic = function (s, ms) { vr.ctrls.forEach(c => { try { const g = c.userData.src && c.userData.src.gamepad; const a = g && (g.hapticActuators && g.hapticActuators[0]); if (a && a.pulse) a.pulse(s, ms); else if (g && g.vibrationActuator) g.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: s, weakMagnitude: s }); } catch (e) {} }); };

  function hitPanel(c) {
    const o = new T.Vector3(), d = new T.Vector3(0, 0, -1), m = new T.Matrix4().extractRotation(c.matrixWorld);
    o.setFromMatrixPosition(c.matrixWorld); d.applyMatrix4(m); ray.set(o, d); ray.far = 6; ray.camera = camera;
    return { o, d, hp: A.vrp.mesh.visible ? ray.intersectObject(A.vrp.mesh)[0] : null };
  }
  function onSelect(c) {
    const r = hitPanel(c);
    if (r.hp) { A.vrHover(r.hp.uv); A.vrPress(); A.vrp.dirty = true; return; }
    if (A.view() === 'map') { const h = ray.intersectObject(A.mapMesh)[0]; if (h) { const p = A.mapG.worldToLocal(h.point.clone()); A.map.click(p.x, p.z); } }
  }
  let prevB = {};
  function xrInput(dt) {
    let hover = null, lenAll = 3;
    vr.ctrls.forEach(c => {
      const r = hitPanel(c), line = c.getObjectByName('ray');
      if (r.hp && (!hover || c.userData.pressed)) hover = r.hp.uv; line.scale.z = r.hp ? r.hp.distance / 3 : 1;
      const src = c.userData.src, g = src && src.gamepad; if (!g) return;
      const ax = g.axes.length >= 4 ? [g.axes[2], g.axes[3]] : [g.axes[0] || 0, g.axes[1] || 0], dz = v => Math.abs(v) > 0.18 ? v : 0, X = dz(ax[0]), Y = dz(ax[1]), left = src.handedness === 'left';
      const pb = prevB[c.userData.i] || (prevB[c.userData.i] = {}), btn = i => g.buttons[i] && g.buttons[i].pressed, edge = (i, fn) => { const n = btn(i); if (n && !pb[i]) fn(); pb[i] = n; };
      edge(4, () => A.vrToggleScale()); edge(5, () => { A.vrp.mesh.visible = !A.vrp.mesh.visible; }); edge(1, () => A.vrRecenter());
      if (r.hp && Y) A.vrScrollBy(Y * 900 * dt);
      else if (S.view === 'macro' && S.vrScale || S.view === 'dive') { // voo livre
        if (left) { const f = new T.Vector3(); renderer.xr.getCamera(camera).getWorldDirection(f); const sp = 2.2 * dt; vr.a.x -= f.x * -Y * sp * -1 * -1; vr.a.y -= f.y * -Y * sp * -1 * -1; vr.a.z -= f.z * -Y * sp * -1 * -1; vr.a.x -= 0; }
        else vr.yaw += X * dt * 1.2;
      } else { if (!left) vr.yaw += X * dt * 1.2; else { vr.a.y = A.clamp(vr.a.y - Y * dt * 0.5, 0.4, 2); } }
    });
    A.vrHover(hover); A.vrDragUpdate();
    // aplica pose do palco (suavizada)
    const k = Math.min(1, dt * 4), sc = lerpV(stage.scale.x, vr.s, k), off = vr.c.clone().multiplyScalar(sc).applyAxisAngle(new T.Vector3(0, 1, 0), vr.yaw);
    stage.scale.setScalar(sc); stage.rotation.y = vr.yaw; stage.position.lerp(vr.a.clone().sub(off), k);
  }

  /* ---------- laço principal ---------- */
  let last = performance.now(), t0 = last;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; const t = (now - t0) / 1000, v = A.view();
    const pres = renderer.xr.isPresenting;
    if (v === 'macro' || v === 'dive') { A.worldUpdate(dt, t); A.volcanoUpdate(dt, t); A.flowUpdate(dt, t); }
    else if (v === 'micro') A.flowUpdate(dt, t);
    else if (v === 'map') { A.mapUpdate(dt); A.volcanoUpdate(dt, t); }
    A.uiUpdate(dt);
    if (pres) { xrInput(dt); if (A.dirty || A.vrp.dirty || now - lastDraw > 300) { A.drawVRPanel(); lastDraw = now; A.dirty = false; } }
    else {
      A.dirty = false; const k = Math.min(1, dt * 5);
      for (const key of ['tx', 'ty', 'tz', 'az', 'el', 'dist']) cam[key] += (des[key] - cam[key]) * k;
      const ce = Math.cos(cam.el); camera.position.set(cam.tx + cam.dist * Math.sin(cam.az) * ce, cam.ty + cam.dist * Math.sin(cam.el), cam.tz + cam.dist * Math.cos(cam.az) * ce);
      camera.lookAt(cam.tx, cam.ty, cam.tz);
    }
    renderer.render(scene, camera);
  }
  window.addEventListener('error', e => { const m = document.getElementById('vrMsg'); if (m) m.textContent = 'Erro: ' + e.message; });
  document.readyState === 'complete' ? init() : addEventListener('load', init);
})();
